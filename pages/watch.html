<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Assistindo: One Piece</title>
  <link rel="stylesheet" href="../style/watch.css">
</head>
<body>
  <div class="fullscreen-player">
    <!-- Topo: Voltar e Reportar -->
    <header class="player-header">
      <!-- Ícone Voltar -->
      <a href="details.html" class="icon-btn" title="Voltar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>
      <!-- Ícone Reportar/Bandeira -->
      <button class="icon-btn" title="Reportar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
        </svg>
      </button>
    </header>

    <!-- Botão Pular Abertura -->
    <button class="skip-intro">Pular abertura</button>

    <!-- Área Inferior de Controles -->
    <div class="bottom-controls">
      
      <!-- Linha 1: Barra de Progresso e Tempo -->
      <div class="timeline-row">
        <div class="progress-container">
          <div class="progress-bar">
            <!-- Representando o vídeo tocando -->
            <div class="progress-filled" style="width: 15%;"></div>
          </div>
        </div>
        <span class="time-remaining">23:45</span>
      </div>

      <!-- Linha 2: Botões e Título -->
      <div class="buttons-row">
        
        <!-- Controles da Esquerda -->
        <div class="control-group left">
          
          <!-- Botão Play -->
          <button class="icon-btn play-btn" title="Play">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- Botão Retroceder 10s -->
          <button class="icon-btn" title="Retroceder 10s">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
          </button>

          <!-- Botão Avançar 10s -->
          <button class="icon-btn" title="Avançar 10s">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            </svg>
          </button>

          <!-- Botão Volume -->
          <button class="icon-btn" title="Volume">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>

        <!-- Título no Centro -->
        <div class="control-group center">
          <h2><strong>One Piece</strong> E377 The Pain of My Crewmates Is My Pain! Zoro's Desperate Fight!</h2>
        </div>

        <!-- Controles da Direita -->
        <div class="control-group right">
          
          <!-- Botão Próximo Episódio -->
          <button class="icon-btn" title="Próximo Episódio">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <!-- Botão Lista de Episódios -->
          <button class="icon-btn" title="Episódios">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
            </svg>
          </button>

          <!-- Botão Legendas/Áudio -->
          <button class="icon-btn" title="Áudio e Legendas">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
            </svg>
          </button>

          <!-- Botão Velocidade -->
          <button class="icon-btn" title="Velocidade">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
            </svg>
          </button>

          <!-- Botão Tela Cheia -->
          <button class="icon-btn" title="Tela Cheia">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
