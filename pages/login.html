<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Entrar</title>

  <link rel="stylesheet" href="../style/login.css">
</head>



<body>
  <header class="login-header">
    <a href="./index.html" class="logo">NETFLIX</a>
  </header>


  <main class="login-container">
    <div class="login-box">
      <h2>Entrar</h2>
      
      <!-- Formulário -->
      <form action="profiles.html">
        <div class="input-group">

          <input type="email" id="email" required placeholder=" ">
          <label for="email">E-mail</label>
        </div>
        
        <div class="input-group">
          <input type="password" id="senha" required placeholder=" ">
          <label for="senha">Senha</label>
        </div>
        
        <button type="submit" class="btn-submit">Entrar</button>
        
        <!-- Links de ajuda -->
        <div class="form-help">
          <div class="remember-me">
            <input type="checkbox" id="lembrar">
            <label for="lembrar">Lembrar de mim</label>
          </div>
          <a href="#">Esqueceu sua senha?</a>
        </div>
      </form>
      
      <!-- Rodapé -->
      <footer class="login-footer">
        <p>Ainda não possui uma conta? <a href="./index.html">Assine agora.</a></p>
      </footer>
    </div>
  </main>
</body>
</html>
